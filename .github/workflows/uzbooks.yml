name: UzBooks

on:
  schedule:
    - cron: "13 */2 * * *"     # bot tinglovchisi to'xtab qolgan bo'lsa, qayta yoqadi (zaxira)
    - cron: "0 14 * * *"       # navbatda qolib ketgan kitob bo'lsa, ishlab chiqadi (zaxira)
  workflow_dispatch:
    inputs:
      task:
        description: "listen (botni yoqish) yoki produce (video tayyorlash)"
        default: "listen"

permissions:
  contents: write
  actions: write

jobs:
  # ---------------- 1) Bot: doimiy tinglovchi (har ~6 soatda o'zini yangilaydi) ----------------
  listen:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'listen') || github.event.schedule == '13 */2 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: uzbooks-listener
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Botni tinglash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          GEMINI_API_KEY: "unused"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.listener 340

  # ---------------- 2) Video tayyorlash ----------------
  produce:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'produce') || github.event.schedule == '0 14 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 320
    concurrency:
      group: uzbooks-produce
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutubxonalar
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          mkdir -p fonts
          curl -sL -o fonts/Montserrat-ExtraBold.ttf \
            "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-ExtraBold.ttf" || true

      - name: Video tayyorlash
        env:
          USE_LISTENER: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TEXT_MODEL: ${{ vars.TEXT_MODEL }}
          TEXT_MODEL_FALLBACKS: ${{ vars.TEXT_MODEL_FALLBACKS }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          EDGE_VOICE: ${{ vars.EDGE_VOICE }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          VISUAL_MODE: ${{ vars.VISUAL_MODE }}
          MAX_AI_IMAGES: ${{ vars.MAX_AI_IMAGES }}
          ELEVENLABS_STABILITY: ${{ vars.ELEVENLABS_STABILITY }}
        run: python -m src.main produce

      - name: Natijalarni saqlash (7 kun)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uzbooks-output
          path: |
            work/**/video.mp4
            work/**/thumbnail.jpg
            work/**/script.json
            work/**/scenes.json
            work/**/result.json
          retention-days: 7
          if-no-files-found: ignore
